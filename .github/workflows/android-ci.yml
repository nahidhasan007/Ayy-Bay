name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: AndroidStudioProjects/MVIAPP

jobs:
  build:
    name: Lint, unit test & build debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint (prod + stage debug)
        run: ./gradlew lintProdDebug lintStageDebug --stacktrace

      - name: Run unit tests (prod + stage debug)
        run: ./gradlew testProdDebugUnitTest testStageDebugUnitTest --stacktrace

      - name: Build debug APKs (prod + stage)
        run: ./gradlew assembleProdDebug assembleStageDebug --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: AndroidStudioProjects/MVIAPP/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: AndroidStudioProjects/MVIAPP/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: AndroidStudioProjects/MVIAPP/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
